<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="75%" stop-color="#31103f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="accent-grad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>
  </defs>

  <!-- Base background gradient -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>

  <!-- Glowing atmospheric blurred shapes -->
  <circle cx="1000" cy="80" r="220" fill="url(#accent-grad1)" filter="url(#glow)"/>
  <circle cx="200" cy="280" r="180" fill="url(#accent-grad2)" filter="url(#glow)"/>
  <circle cx="650" cy="-40" r="250" fill="#f59e0b" fill-opacity="0.15" filter="url(#glow)"/>

  <!-- Dot matrix overlay -->
  <rect width="1200" height="360" fill="url(#dot-grid)"/>

  <!-- Geometric architectural lines / waves -->
  <path d="M-100,260 Q300,100 700,280 T1300,180" fill="none" stroke="url(#accent-grad1)" stroke-width="2" stroke-opacity="0.4"/>
  <path d="M-50,300 Q400,140 800,320 T1350,220" fill="none" stroke="url(#accent-grad1)" stroke-width="1.5" stroke-opacity="0.25"/>
  <path d="M-150,180 Q200,320 600,120 T1250,260" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,8" stroke-opacity="0.15"/>

  <!-- Floating tech polygons -->
  <polygon points="920,120 950,102 980,120 980,156 950,174 920,156" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.3"/>
  <polygon points="1020,200 1040,188 1060,200 1060,224 1040,236 1020,224" fill="none" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4"/>
  <polygon points="140,80 165,65 190,80 190,110 165,125 140,110" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Subtle brand watermark -->
  <g transform="translate(1020, 295)" opacity="0.25">
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="3">OPENBOX</text>
  </g>
</svg>
